<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emotion Detector</title>
</head>
<body>
    <h1>Emotion Detector</h1>
    <textarea id="textToAnalyze" rows="4" cols="50" placeholder="Enter text here..."></textarea><br>
    <button onclick="analyzeEmotion()">Analyze Emotion</button>
    <div id="result"></div>

    <script>
        function analyzeEmotion() {
            var text = document.getElementById("textToAnalyze").value;
            fetch('/emotionDetector?textToAnalyze=' + encodeURIComponent(text))
                .then(response => response.text())
                .then(data => {
                    document.getElementById("result").innerHTML = data;
                });
        }
    </script>
</body>
</html>
